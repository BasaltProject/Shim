name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              .github/scripts/plan-version.sh release
          else
              .github/scripts/plan-version.sh ci
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15
            target: macOS-arm64
          - os: macos-15
            target: macOS-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 300M
          key: ${{ matrix.target }}

      - name: Install the Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build zlib1g-dev
          echo "CC=clang" >>"$GITHUB_ENV"
          echo "CXX=clang++" >>"$GITHUB_ENV"
          echo "SHIM_EXTRA_ARGS=-DSHIM_FRAME_POINTER=ON" >>"$GITHUB_ENV"

      - name: Install the macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          args="-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"
          if [ -n "${{ matrix.arch }}" ]; then args="$args -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"; fi
          echo "SHIM_EXTRA_ARGS=$args" >>"$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}" $SHIM_EXTRA_ARGS

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the architecture
        if: matrix.arch == 'x86_64'
        run: file build/shim | grep -q x86_64

      - name: Package
        run: .github/scripts/package.sh "${{ needs.plan.outputs.version }}" "${{ matrix.target }}" build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  windows:
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-lld

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              "-DSHIM_JAVA_HOME=$(cygpath -m "$JAVA_HOME")" \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}"

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: .github/scripts/package.sh "${{ needs.plan.outputs.version }}" Windows-x64 build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-Windows-x64
          path: dist/

  musl:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-musl-x64
          - os: ubuntu-24.04-arm
            target: Linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -e VERSION -e TARGET -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache bash build-base clang cmake ninja openjdk17-jdk zlib-dev linux-headers file tar coreutils
            export JAVA_HOME=/usr/lib/jvm/default-jvm
            CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
                -DSHIM_FRAME_POINTER=ON "-DSHIM_VERSION_STRING=$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure
            bash .github/scripts/package.sh "$VERSION" "$TARGET" build
          '

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  freebsd:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        with:
          release: '14.5'
          envs: VERSION
          cpu: 4
          mem: 8192
          prepare: pkg install -y bash cmake ninja openjdk17
          run: |
            set -eu
            export JAVA_HOME=/usr/local/openjdk17
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON "-DSHIM_VERSION_STRING=$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure
            bash .github/scripts/package.sh "$VERSION" FreeBSD-x64 build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-FreeBSD-x64
          path: dist/

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [plan, build, windows, musl, freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: shim-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
              .github/scripts/plan-version.sh release
          else
              .github/scripts/plan-version.sh ci
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15
            target: macOS-arm64
          - os: macos-15
            target: macOS-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 300M
          key: ${{ matrix.target }}

      - name: Install the Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build zlib1g-dev
          echo "CC=clang" >>"$GITHUB_ENV"
          echo "CXX=clang++" >>"$GITHUB_ENV"
          echo "SHIM_EXTRA_ARGS=-DSHIM_FRAME_POINTER=ON" >>"$GITHUB_ENV"

      - name: Install the macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          args="-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0"
          if [ -n "${{ matrix.arch }}" ]; then args="$args -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"; fi
          echo "SHIM_EXTRA_ARGS=$args" >>"$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}" $SHIM_EXTRA_ARGS

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the architecture
        if: matrix.arch == 'x86_64'
        run: file build/shim | grep -q x86_64

      - name: Package
        run: .github/scripts/package.sh "${{ needs.plan.outputs.version }}" "${{ matrix.target }}" build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  windows:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: Windows-x64
            msystem: CLANG64
            prefix: mingw-w64-clang-x86_64
            java: temurin
            process: compile
          - os: windows-11-arm
            target: Windows-arm64
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            java: microsoft
            process: compile
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java }}
          java-version: '17'

      - name: Install the MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: false
          install: >-
            ${{ matrix.prefix }}-clang
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
            ${{ matrix.prefix }}-zlib
            ${{ matrix.prefix }}-lld

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              "-DSHIM_JAVA_HOME=$(cygpath -m "$JAVA_HOME")" \
              "-DSHIM_PROCESS=${{ matrix.process }}" \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}"

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: .github/scripts/package.sh "${{ needs.plan.outputs.version }}" "${{ matrix.target }}" build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  musl:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-musl-x64
          - os: ubuntu-24.04-arm
            target: Linux-musl-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on Alpine
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -e VERSION -e TARGET -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache bash build-base clang cmake ninja openjdk17-jdk zlib-dev linux-headers file tar coreutils
            export JAVA_HOME=/usr/lib/jvm/default-jvm
            CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
                -DSHIM_FRAME_POINTER=ON "-DSHIM_VERSION_STRING=$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure
            bash .github/scripts/package.sh "$VERSION" "$TARGET" build
          '

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  freebsd:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: FreeBSD-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TARGET: ${{ matrix.target }}
        with:
          release: '14.5'
          arch: ${{ matrix.arch }}
          envs: VERSION TARGET
          cpu: 4
          mem: 8192
          prepare: pkg install -y bash cmake ninja openjdk17
          run: |
            set -eu
            export JAVA_HOME=/usr/local/openjdk17
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON "-DSHIM_VERSION_STRING=$VERSION"
            cmake --build build
            ctest --test-dir build --output-on-failure
            bash .github/scripts/package.sh "$VERSION" "$TARGET" build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  freebsd-arm64:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 ninja-build

      - name: Extract the FreeBSD arm64 sysroot
        run: .github/scripts/setup-freebsd-sysroot.sh

      - name: Build the host tools
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=
          cmake --build build-host --target shim_binary_to_object shim_type_generator

      - name: Cross-build for FreeBSD arm64
        run: |
          root="$PWD/build/freebsd-sysroot"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
              -DCMAKE_SYSTEM_NAME=FreeBSD -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
              -DCMAKE_CXX_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
              -DCMAKE_ASM_COMPILER=clang-19 -DCMAKE_ASM_COMPILER_TARGET=aarch64-unknown-freebsd14.5 \
              "-DCMAKE_SYSROOT=$root" \
              "-DCMAKE_CXX_FLAGS=-nostdinc++ -isystem $root/usr/include/c++/v1" \
              "-DCMAKE_EXE_LINKER_FLAGS=-nostdlib++ -fuse-ld=lld" \
              "-DCMAKE_SHARED_LINKER_FLAGS=-nostdlib++ -fuse-ld=lld" \
              "-DCMAKE_CXX_STANDARD_LIBRARIES=$root/usr/lib/libc++.a $root/usr/lib/libcxxrt.a -lpthread" \
              -DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=CMAKE_CXX_STANDARD_LIBRARIES \
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
              "-DSHIM_HOST_TOOLS_DIR=$PWD/build-host" \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}"
          cmake --build build
          readelf -h build/shim | grep -F AArch64
          readelf -l build/shim | grep -F /libexec/ld-elf.so.1

      - name: Run the tests on FreeBSD arm64
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          arch: aarch64
          cpu: 4
          mem: 8192
          run: |
            set -eu
            cd build
            for program in Hello Strings Exceptions Collections Floats Integers Longs Widening Misc Enums Reflection Threads GC InvokeDynamic; do
                echo "== $program"
                ./shim -cp test $program
            done

      - name: Package
        run: bash .github/scripts/package.sh "${{ needs.plan.outputs.version }}" FreeBSD-arm64 build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-FreeBSD-arm64
          path: dist/

  android:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android-arm64
            abi: arm64-v8a
            machine: AArch64
          - target: Android-x64
            abi: x86_64
            machine: Advanced Micro Devices X86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install the Android NDK
        run: |
          n=0
          until sdkmanager 'ndk;29.0.14206865'; do
            n=$((n + 1)); [ "$n" -lt 4 ] || exit 1; sleep $((n * 15))
          done
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >>"$GITHUB_ENV"

      - name: Build the host tools
        run: |
          cmake -S . -B build-host -G Ninja -DCMAKE_BUILD_TYPE=
          cmake --build build-host --target shim_binary_to_object shim_type_generator

      - name: Cross-build for Android
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON \
              "-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
              "-DSHIM_HOST_TOOLS_DIR=$PWD/build-host" \
              "-DSHIM_VERSION_STRING=${{ needs.plan.outputs.version }}"
          cmake --build build

      - name: Check the Android executable
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          readelf -h build/shim | grep -F "$MACHINE"
          readelf -l build/shim | grep -F '/system/bin/linker'

      - name: Free disk space for the emulator
        if: matrix.abi == 'x86_64'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on Android 10
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 3072M
          script: .github/scripts/test-android.sh build

      - name: Package
        run: bash .github/scripts/package.sh "${{ needs.plan.outputs.version }}" "${{ matrix.target }}" build

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: shim-${{ matrix.target }}
          path: dist/

  release:
    if: ${{ github.event_name == 'push' }}
    needs: [plan, build, windows, musl, freebsd, freebsd-arm64, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: shim-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts

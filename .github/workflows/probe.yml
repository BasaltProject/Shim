name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang ninja-build zlib1g-dev cmake
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE= -DBUILD_TESTING=ON -DSHIM_FRAME_POINTER=ON
          cmake --build build
          build/shim -cp build/test ArmProbe || true
